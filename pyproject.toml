[project]
name = "email-intelligence-slm"
version = "0.1.0"
description = "Data engineering and pluggable email intelligence services"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "FPT Email Intelligence SLM Team" }]

dependencies = [
    "click>=8.1.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "mlflow>=2.10.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
email-data = "cli.main:cli"
email-mlops = "cli.mlops:cli"
email-obs = "cli.observability:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/email_data_engineering",
    "src/email_mlops",
    "src/email_intelligence",
    "src/email_inference",
    "src/email_api",
    "cli",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
