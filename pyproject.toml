[project]
name = "email-data-engineering"
version = "0.1.0"
description = "Data Engineering module for AI Email Assistant SLM fine-tuning (Epic 1)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "FPT Email Intelligence SLM Team" }]

dependencies = [
    "click>=8.1.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "mlflow>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
email-data = "cli.main:cli"
email-mlops = "cli.mlops:cli"
email-obs = "cli.observability:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/email_data_engineering",
    "src/email_mlops",
    "src/email_observability",
    "cli",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
